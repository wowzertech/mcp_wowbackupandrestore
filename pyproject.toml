[project]
name = "s3-mcp"
version = "0.1.0"
description = "Stateless MCP server exposing tenant-scoped S3 data, authorized via Auth0"
requires-python = ">=3.11"
dependencies = [
    # Official MCP Python SDK v2 — implements the 2026-07-28 stateless spec.
    # NOTE: this is the SDK's bundled FastMCP, now named MCPServer.
    # If you want PrefectHQ's standalone FastMCP 4.x instead, swap this line
    # for `fastmcp>=4.0` and see the note at the top of server.py.
    "mcp[cli]>=2.0.0",
    "starlette>=0.41",
    "uvicorn>=0.32",
    "boto3>=1.35",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_mcp"]
